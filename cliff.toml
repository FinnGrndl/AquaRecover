[changelog]
header = """# Changelog

Changes are generated from Conventional Commit messages. AquaRecover follows
semantic versioning; the number after `+` is the platform build number.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = """"""

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Reverted" },
  { message = "^docs", group = "Documentation" },
  { message = "^(chore|ci|build|style|test)(\\(.+\\))?:", skip = true },
  { message = ".*", group = "Other" },
]
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
# The first public GitHub/App Store release is 1.1.0. After that tag exists,
# git-cliff derives every later version from the latest matching release tag.
initial_tag = "v1.1.0"
no_increment_regex = "^(chore|ci|docs|build|style|test|revert)(\\(.+\\))?(!)?:"
