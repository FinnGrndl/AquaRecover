name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, and test
    # Never run code from pull requests on the private self-hosted machine.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Verify generated app icons
        run: |
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          if [ -n "$(git status --porcelain -- android/app/src/main/res ios/Runner/Assets.xcassets/AppIcon.appiconset macos/Runner/Assets.xcassets/AppIcon.appiconset windows/runner/resources/app_icon.ico)" ]; then
            git status --short -- android/app/src/main/res ios/Runner/Assets.xcassets/AppIcon.appiconset macos/Runner/Assets.xcassets/AppIcon.appiconset windows/runner/resources/app_icon.ico
            exit 1
          fi
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter build apk --debug --no-pub

  apple-builds:
    name: Apple debug builds
    # Pull requests remain isolated on disposable GitHub-hosted runners.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-15"]' || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter build ios --simulator --debug --no-pub
      - run: flutter build macos --debug --no-pub

  windows-build:
    name: Windows debug build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter build windows --debug --no-pub
        shell: bash
