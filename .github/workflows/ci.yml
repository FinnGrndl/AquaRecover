name: CI
run-name: CI · ${{ inputs.source_sha || github.sha }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, test, and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Test single-commit release snapshots
        run: scripts/test_release_snapshot.sh
      - uses: ./.github/actions/setup-flutter
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify requested source
        if: inputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify generated app icons
        run: |
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          if [ -n "$(git status --porcelain -- android/app/src/main/res ios/Runner/Assets.xcassets/AppIcon.appiconset macos/Runner/Assets.xcassets/AppIcon.appiconset windows/runner/resources/app_icon.ico)" ]; then
            git status --short -- android/app/src/main/res ios/Runner/Assets.xcassets/AppIcon.appiconset macos/Runner/Assets.xcassets/AppIcon.appiconset windows/runner/resources/app_icon.ico
            exit 1
          fi
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --no-pub

  apple-builds:
    name: Apple debug builds
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter build ios --simulator --debug --no-pub
      - run: flutter build macos --debug --no-pub

  windows-build:
    name: Windows debug build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter build windows --debug --no-pub
        shell: bash
