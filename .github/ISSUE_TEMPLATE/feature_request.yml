name: Feature request
description: Suggest a focused change to AquaRecover
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or unavailable today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction or output, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Main platform
      options:
        - All platforms
        - iOS
        - macOS
        - Android
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request.
          required: true
        - label: This request does not require a paid service for core functionality.
          required: true
